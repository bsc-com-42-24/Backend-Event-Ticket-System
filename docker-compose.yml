services:
  db:
    image: postgres:16
    container_name: ticket-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_master
    ports:
      - "5432:5432"
    volumes:
      - ./event_ticket_booking_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata: